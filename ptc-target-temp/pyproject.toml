[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF100"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "F841"]  # sys.path.insert() before imports; WIP scripts
"tests/test_preprocess.py" = ["E402"]  # late imports for golden fixtures section

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: long-running tests",
  "integration: tests requiring external services",
  "gpu: tests requiring CUDA/GPU",
  "property: property-based hypothesis tests",
  "system: tests requiring real golden crop data fixtures",
  "golden: golden example tests with exact expected values",
  "real_data: tests requiring data/roboflow_dataset/ to be present",
]

[tool.pyright]
include = ["producer", "consumer", "common", "scripts", "tests", "training", "tools"]
exclude = ["vendor/**"]
# Ignore missing stubs for third-party packages that are installed at runtime
reportMissingImports = "none"
# TensorRT uses C++ bindings without Python type stubs
reportAttributeAccessIssue = "warning"
